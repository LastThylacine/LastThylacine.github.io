  <header class="bar">

    <h1 class="sr">Last Thylacine</h1>

    <section class="game" aria-labelledby="pb-title">

        <img class="app-icon" src="assets/pb-icon.png" width="144" height="144" alt="">
        <h2 id="pb-title">Powder Box 3D</h2>
      </div>
      <p>A voxel sandbox where everything falls, flows, burns and explodes. Build a world, then break it.</p>
      <div class="game__actions">
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.LastThylacine.PowderBox3D" target="_blank" rel="noopener" aria-label="Get Powder Box 3D on Google Play">
